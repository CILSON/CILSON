<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1b1035;#0f0c29" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#241b4d">
        <animate attributeName="stop-color" values="#241b4d;#3a2570;#241b4d" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1b1035;#0f0c29" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.25;0.45;0.25" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="scan" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect width="100%" height="1.2" fill="#ffffff" opacity="0.025"/>
    </pattern>

    <clipPath id="c1"><rect x="97" y="88" height="30" width="0"><animate attributeName="width" from="0" to="132" dur="0.45s" begin="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="97" y="176" height="30" width="0"><animate attributeName="width" from="0" to="236" dur="0.55s" begin="2.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="97" y="264" height="30" width="0"><animate attributeName="width" from="0" to="150" dur="0.45s" begin="3.4s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="1200" height="380" fill="url(#bgGrad2)"/>
  <rect width="1200" height="380" fill="url(#glow2)"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.05s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.6s" begin="0.05s" fill="freeze" additive="sum"/>

    <rect x="60" y="30" width="1080" height="320" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect x="61" y="31" width="1078" height="40" rx="14" fill="#161b22"/>
    <rect x="61" y="55" width="1078" height="16" fill="#161b22"/>

    <circle cx="90" cy="51" r="6" fill="#ff5f56"/>
    <circle cx="112" cy="51" r="6" fill="#ffbd2e"/>
    <circle cx="134" cy="51" r="6" fill="#27c93f"/>
    <text x="600" y="56" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',monospace" font-size="13" fill="#8b949e">cilson@iitbhu &#8212; zsh</text>

    <g font-family="'Fira Code','JetBrains Mono',monospace" font-size="20">
      <g clip-path="url(#c1)">
        <text x="97" y="110"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
      </g>

      <text x="97" y="150" fill="#c9a7ff" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.3s" fill="freeze"/>
        &gt; Cilson &#8212; Pharma Engineering &#215; AI &#215; Quant
      </text>

      <g clip-path="url(#c3)">
        <text x="97" y="198"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">cat mission.txt</tspan></text>
      </g>

      <text x="97" y="238" fill="#c9a7ff" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.7s" fill="freeze"/>
        &gt; Building an AI &#215; Healthcare company
      </text>

      <g clip-path="url(#c5)">
        <text x="97" y="286"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">whereami</tspan></text>
      </g>

      <text x="97" y="326" fill="#c9a7ff" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.0s" fill="freeze"/>
        &gt; IIT (BHU) Varanasi &#183; Class of 2029
      </text>

      <rect x="428" y="311" width="11" height="22" fill="#e6edf3" opacity="0">
        <animate attributeName="opacity" values="1;0;1;0;1" dur="1.1s" begin="4.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="61" y="31" width="1078" height="318" rx="13" fill="url(#scan)"/>
  </g>
</svg>
